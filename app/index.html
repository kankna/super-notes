<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="以学习资料为依据、以主动输出为核心、支持自定义流程的学习系统" />
    <meta name="theme-color" content="#17120e" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons.svg" />
    <title>书斋 · Super Notes</title>
    <script>
      // 在首帧之前定好模式与强调色，避免闪一下白/黑
      ;(function () {
        try {
          var m = localStorage.getItem('sn.mode')
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          var a = localStorage.getItem('sn.accent') || 'indigo'
          document.documentElement.setAttribute('data-mode', m)
          document.documentElement.setAttribute('data-accent', a)
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'dark')
          document.documentElement.setAttribute('data-accent', 'indigo')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {})
        })
      }
    </script>
  </body>
</html>
